[program:cloudflared-ollama]
command=cloudflared tunnel --no-autoupdate --url http://127.0.0.1:11434 --http-host-header=localhost:11434
user=cloudflared
environment=HOME="/etc/cloudflared"
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/cloudflared-ollama.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/cloudflared-ollama-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
