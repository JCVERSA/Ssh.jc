[program:ollama]
command=ollama serve
user=ollama
environment=OLLAMA_HOST="127.0.0.1:11434",OLLAMA_ORIGINS="*",OLLAMA_CONTEXT_LENGTH="1024",OLLAMA_KEEP_ALIVE="5m",OLLAMA_MAX_LOADED_MODELS="1",OLLAMA_NUM_PARALLEL="1",HOME="/var/lib/ollama"
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/ollama.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/ollama-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
