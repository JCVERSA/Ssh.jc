    <script>
      // Gracefully prevent unhandled WebSocket/HMR disconnect rejections in sandboxed iframe runtime
      (function() {
        function isViteHmr(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || val.stack || String(val));
          return (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('@vite/client') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isViteHmr(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isViteHmr(event.message) || isViteHmr(event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
